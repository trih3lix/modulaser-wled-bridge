[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modulaser-wled-bridge"
version = "0.1.0"
description = "Real-time bridge driving WLED devices to mirror a Modulaser laser show."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "python-osc>=1.8,<2",
    "requests>=2.28,<3",
    "zeroconf>=0.100,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
# NDI frame-sync mode. ndi-python is sparsely maintained; if it will not
# install on your platform, use the OSC color source (no extra needed).
ndi = [
    "ndi-python>=5.1.1.5",
    "numpy>=1.23",
]
test = [
    "pytest>=7",
    "numpy>=1.23",
]

[project.scripts]
modulaser-wled-bridge = "modulaser_wled_bridge:main"

[tool.setuptools]
py-modules = ["modulaser_wled_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
