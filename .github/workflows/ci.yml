name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + test deps, no NDI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-osc requests zeroconf pyyaml numpy pytest
      - name: Byte-compile
        run: python -m py_compile modulaser_wled_bridge.py
      - name: Run tests
        run: python -m pytest -q
